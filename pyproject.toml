[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pha-core"
version = "0.1.0"
description = "Traceable static FTA, LOPA, low-demand SIF calculations and PRISM integration"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
tables = ["openpyxl>=3.1,<4"]

[project.scripts]
pha = "pha_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pha_core = ["web/*.html", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["integration: executes the explicitly selected optional PRISM checkout and real workers"]
